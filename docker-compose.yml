services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: queuesense
      MYSQL_USER: queuesense
      MYSQL_PASSWORD: queuesense
      MYSQL_ROOT_PASSWORD: rootpassword
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpassword --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: {context: ., dockerfile: api/Dockerfile}
    environment:
      PORT: 4000
      DATABASE_URL: mysql://queuesense:queuesense@mysql:3306/queuesense
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local-docker-access-secret-change-me-123456789
      JWT_REFRESH_SECRET: local-docker-refresh-secret-change-me-123456789
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: development
      LOG_LEVEL: info
    ports: ["4000:4000"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  dashboard:
    build: {context: ., dockerfile: dashboard/Dockerfile}
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  mysql_data:
  redis_data:
